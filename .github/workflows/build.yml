name: Gerar APK Android

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Instalar Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Instalar Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.x'
          channel: 'stable'

      - name: Recriar estrutura Flutter Android
        run: |
          rm -rf android
          flutter create --org com.exemplo --project-name iptv_player --platforms=android .
          flutter pub get

      - name: Configurar Permissões de Rede e TV
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          sed -i 's/<application/<application android:usesCleartextTraffic="true"/' $MANIFEST
          sed -i '/<manifest/a \    <uses-permission android:name="android.permission.INTERNET"\/>\n    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE"\/>\n    <uses-feature android:name="android.hardware.touchscreen" android:required="false"\/>\n    <uses-feature android:name="android.software.leanback" android:required="false"\/>' $MANIFEST

      - name: Compilar APK
        run: flutter build apk --debug

      - name: Disponibilizar APK para Download
        uses: actions/upload-artifact@v4
        with:
          name: iptv-player-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
